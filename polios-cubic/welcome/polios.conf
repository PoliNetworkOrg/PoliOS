# PoliOS Welcome settings (installed root-owned in /opt/polios-welcome by install.sh).
[remote]
# Online course list: the SAME file as the built-in one, read from the main branch of the PoliOS repo.
# Must be an https://raw.githubusercontent.com/... URL (anything else is ignored).
# Whoever can edit that file decides what gets installed on students' computers:
# the main branch is protected (pull request + review required).
# Leave it empty to use only the list built into the system.
courses_url = https://raw.githubusercontent.com/PoliNetworkOrg/PoliOS/main/polios-cubic/welcome/courses.conf
