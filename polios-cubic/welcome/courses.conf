# PoliOS Welcome: course list, ONE ENTRY PER DEGREE (plus a few entries for everyone).
# ONE file, two uses: it is built into the ISO AND the wizard downloads this same file from GitHub
# (main branch) whenever the student is online. So: a change merged into main reaches students right away.
# Every pull request is checked automatically (syntax + apt package names), see .github/workflows/check.yml.
#
# One [section] per entry:
#   [short-id]                 lowercase letters, digits and "-"
#   title       = ...          shown in the wizard (ITALIAN, the default language)
#   title_en    = ...          optional English title (falls back to the Italian one)
#   description = ...          optional, shown after the title (Italian)
#   description_en = ...       optional English description
#   apt         = a b c        apt packages (space separated; can continue on indented lines)
#   flatpak     = x.y.Z        optional Flathub app IDs (reverse-DNS, e.g. org.kicad.KiCad)
#   extra       = google-chrome  optional: third-party software with a built-in recipe (only 'google-chrome' for now)
#   enabled     = no           optional: hide a draft entry
#
# Check the names before shipping (no root needed):  polios-welcome-helper --check courses.conf
# IMPORTANT: all flatpak apps selected in one run are installed with a single command. ONE wrong
# Flatpak ID makes that whole step fail for the student. Only add IDs you have verified on flathub.org.
#
# Built from programmi-distro.csv (71 programmi; "msg" = colonna messaggi_in_chat). Titoli e descrizioni in
# italiano (lingua predefinita) con versione inglese. Uno studente puo' spuntare piu' voci: i programmi in comune
# (es. GCC) vengono installati una volta sola. Sotto ogni voce, i commenti elencano cosa NON si puo' installare da
# qui (per degree), cosi' questo file e' anche la mappa di cio' che manca.

