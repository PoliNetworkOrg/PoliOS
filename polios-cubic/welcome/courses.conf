# ==============================================================================
# NOTE PER TUTTI (non installabili da questo file)
# ==============================================================================
# Gia' presenti nell'ISO (Linux Mint): Firefox, LibreOffice.
# - Microsoft 365 web + OneDrive 1 TB (68 msg): web app, segnalibro nel browser; il client 'onedrive' esiste in Ubuntu
#   ma richiede la configurazione con l'account del Poli.
# - Citrix Workspace / Desktop virtuale del Poli (20 msg): la via d'uscita piu' citata per i programmi Windows.
#   Il .deb e' pubblico sul sito Citrix (con SHA-256 per ogni release): serve una ricetta.
# - Client videolezioni (9 msg): Zoom e Webex hanno client Linux; Teams solo web.
# - NVIDIA + CUDA (26 msg): usare il Gestore driver di Mint; con Secure Boot attivo serve la registrazione della chiave (MOK).
# - Esami al PC: Safe Exam Browser e Respondus NON funzionano su Linux (1 e 4 msg): ricordarlo nel README come limite noto.
# - MATLAB (224 msg, il piu' citato): MathWorks fornisce 'mpm' (https://www.mathworks.com/mpm/glnxa64/mpm), che installa
#   dal sito MathWorks senza login; l'attivazione si fa al primo avvio con l'account Polimi. Ricetta fattibile; nel
#   frattempo Octave (voce Aerospaziale) e MATLAB Online.